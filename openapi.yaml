openapi: 3.1.0
info:
  title: Skrybe API
  description: API for managing email campaigns, subscribers, and lists
  version: 1.0.0

servers:
  - url: https://dashboard.skry.be
    description: Production server

paths:
  /api/campaigns/create.php:
    post:
      summary: Create and send campaigns
      description: Create, send or schedule an email campaign
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - api_key
                - from_name
                - from_email
                - reply_to
                - subject
                - html_text
              properties:
                api_key:
                  type: string
                  description: Your API key. The campaign is created in this key's brand.
                from_name:
                  type: string
                  description: From name of your campaign
                from_email:
                  type: string
                  description: From email of your campaign
                reply_to:
                  type: string
                  description: Reply to email of your campaign
                title:
                  type: string
                  description: Title (dashboard label) of your campaign
                subject:
                  type: string
                  description: Subject of your campaign
                plain_text:
                  type: string
                  description: Plain text version of your campaign
                html_text:
                  type: string
                  description: HTML version of your campaign
                list_ids:
                  type: string
                  description: Comma-separated encrypted list IDs in the API key's brand (required when sending or scheduling and no segment_ids)
                segment_ids:
                  type: string
                  description: Comma-separated segment IDs in the API key's brand (required when sending or scheduling and no list_ids)
                exclude_list_ids:
                  type: string
                  description: Comma-separated encrypted list IDs to exclude
                exclude_segments_ids:
                  type: string
                  description: Comma-separated segment IDs to exclude
                query_string:
                  type: string
                  description: Google Analytics tags
                track_opens:
                  type: integer
                  enum: [0, 1, 2]
                  default: 1
                  description: 0=disable, 1=enable, 2=anonymous opens tracking
                track_clicks:
                  type: integer
                  enum: [0, 1, 2]
                  default: 1
                  description: 0=disable, 1=enable, 2=anonymous clicks tracking
                send_campaign:
                  type: integer
                  enum: [0, 1]
                  default: 0
                  description: Set to 1 to send immediately
                schedule_date_time:
                  type: string
                  description: Schedule date/time, any format PHP's strtotime() reads (e.g. "June 15, 2027 6:05pm")
                schedule_timezone:
                  type: string
                  description: PHP timezone identifier (e.g. "America/New_York")
                json:
                  type: integer
                  enum: [0, 1]
                  default: 0
                  description: Set to 1 to get a JSON response with the campaign ID (drafts only)
      responses:
        '200':
          description: Every response, success or error, is returned with HTTP 200 as plain text (JSON for a draft created with json=1)
          content:
            text/plain:
              schema:
                type: string
                enum:
                  - Campaign created
                  - Campaign created and now sending
                  - Campaign scheduled
                  - No data passed
                  - API key not passed
                  - Invalid API key
                  - From name not passed
                  - From email not passed
                  - Reply to email not passed
                  - Subject not passed
                  - HTML not passed
                  - List or segment ID(s) not passed
                  - Brand ID not passed.
                  - One or more list IDs are invalid
                  - One or more segment IDs are invalid
                  - Unauthorised From email domain
                  - schedule_date_time is invalid
                  - Unable to calculate totals
                  - Unable to create campaign
                  - Unable to create and send campaign
                  - Unable to schedule campaign
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Campaign created
                  campaign_id:
                    type: string
                    example: '1234'
  /api/campaigns/get-campaigns.php:
    post:
      summary: Get campaigns
      description: Lists the API key's brand's campaigns, newest first, a page at a time
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - api_key
              properties:
                api_key:
                  type: string
                  description: Your API key. The brand is taken from the key.
                page:
                  type: integer
                  description: Page, starting at 1
                  default: 1
                limit:
                  type: integer
                  description: Campaigns per page, clamped to 1-100
                  default: 10
                status:
                  type: string
                  description: Filter by status
                  enum:
                    - draft
                    - scheduled
                    - preparing
                    - sending
                    - sent
                    - paused
      responses:
        '200':
          description: JSON on success; errors are plain text. Every response is HTTP 200.
          content:
            application/json:
              schema:
                type: object
                description: Keyed campaign1, campaign2, ...
                additionalProperties:
                  type: object
                  properties:
                    id:
                      type: integer
                    title:
                      type: string
                      description: Dashboard label, or the subject if there is none
                    subject:
                      type: string
                    status:
                      type: string
                      enum:
                        - draft
                        - scheduled
                        - preparing
                        - sending
                        - sent
                        - paused
                    from_name:
                      type: string
                    from_email:
                      type: string
                    reply_to:
                      type: string
                    recipients:
                      type: integer
                      description: Emails sent so far
                    to_send:
                      type: integer
                      description: Emails the send is going to
                    sent_at:
                      type:
                        - integer
                        - 'null'
                      description: Unix timestamp sending started
                    scheduled_at:
                      type:
                        - integer
                        - 'null'
                      description: Unix timestamp, scheduled campaigns only
                    timezone:
                      type:
                        - string
                        - 'null'
                    source:
                      type: string
                      description: Where it was created, e.g. ui or api
            text/plain:
              schema:
                type: string
                enum:
                  - API key not passed
                  - Invalid API key
                  - Brand does not exist
                  - Invalid status
                  - No campaigns found
  /api/campaigns/get-campaign.php:
    post:
      summary: Get a campaign
      description: Returns one campaign in the API key's brand
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - api_key
                - campaign_id
              properties:
                api_key:
                  type: string
                  description: Your API key. The brand is taken from the key.
                campaign_id:
                  type: integer
                  description: Campaign ID
                include_content:
                  type: string
                  description: yes or true to include html_text and plain_text
      responses:
        '200':
          description: JSON on success; errors are plain text. Every response is HTTP 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                    description: Dashboard label, or the subject if there is none
                  subject:
                    type: string
                  status:
                    type: string
                    enum:
                      - draft
                      - scheduled
                      - preparing
                      - sending
                      - sent
                      - paused
                  from_name:
                    type: string
                  from_email:
                    type: string
                  reply_to:
                    type: string
                  recipients:
                    type: integer
                    description: Emails sent so far
                  to_send:
                    type: integer
                    description: Emails the send is going to
                  sent_at:
                    type:
                      - integer
                      - 'null'
                    description: Unix timestamp sending started
                  scheduled_at:
                    type:
                      - integer
                      - 'null'
                    description: Unix timestamp, scheduled campaigns only
                  timezone:
                    type:
                      - string
                      - 'null'
                  source:
                    type: string
                    description: Where it was created, e.g. ui or api
                  preheader:
                    type: string
                  query_string:
                    type: string
                  track_opens:
                    type: integer
                    enum:
                      - 0
                      - 1
                      - 2
                  track_clicks:
                    type: integer
                    enum:
                      - 0
                      - 1
                      - 2
                  list_ids:
                    type: array
                    items:
                      type: string
                    description: Encrypted list IDs
                  exclude_list_ids:
                    type: array
                    items:
                      type: string
                  segment_ids:
                    type: array
                    items:
                      type: integer
                  exclude_segment_ids:
                    type: array
                    items:
                      type: integer
                  web_version:
                    type: string
                  html_text:
                    type: string
                    description: Only with include_content
                  plain_text:
                    type: string
                    description: Only with include_content
            text/plain:
              schema:
                type: string
                enum:
                  - No data passed
                  - API key not passed
                  - Invalid API key
                  - Campaign ID not passed
                  - Brand does not exist
                  - Campaign does not exist
  /api/campaigns/update-campaign.php:
    post:
      summary: Update a campaign
      description: Edits a draft or scheduled campaign; only the fields passed change
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - api_key
                - campaign_id
              properties:
                api_key:
                  type: string
                  description: Your API key. The brand is taken from the key.
                campaign_id:
                  type: integer
                  description: Campaign ID
                title:
                  type: string
                  description: Dashboard label, max 500 characters
                subject:
                  type: string
                  description: Subject, max 500 characters, not empty
                preheader:
                  type: string
                  description: Preview text, max 255 characters
                from_name:
                  type: string
                  description: Max 100 characters
                from_email:
                  type: string
                  description: Valid email on one of the brand's allowed From domains, max 100 characters
                reply_to:
                  type: string
                  description: Valid email, max 100 characters
                html_text:
                  type: string
                  description: HTML version, not empty
                plain_text:
                  type: string
                  description: Plain text version
                query_string:
                  type: string
                  description: Max 500 characters
                track_opens:
                  type: integer
                  description: 0=disable, 1=enable, 2=anonymous
                  enum:
                    - 0
                    - 1
                    - 2
                track_clicks:
                  type: integer
                  description: 0=disable, 1=enable, 2=anonymous
                  enum:
                    - 0
                    - 1
                    - 2
      responses:
        '200':
          description: JSON on success; errors are plain text. Every response is HTTP 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                    description: Dashboard label, or the subject if there is none
                  subject:
                    type: string
                  status:
                    type: string
                    enum:
                      - draft
                      - scheduled
                      - preparing
                      - sending
                      - sent
                      - paused
                  from_name:
                    type: string
                  from_email:
                    type: string
                  reply_to:
                    type: string
                  recipients:
                    type: integer
                    description: Emails sent so far
                  to_send:
                    type: integer
                    description: Emails the send is going to
                  sent_at:
                    type:
                      - integer
                      - 'null'
                    description: Unix timestamp sending started
                  scheduled_at:
                    type:
                      - integer
                      - 'null'
                    description: Unix timestamp, scheduled campaigns only
                  timezone:
                    type:
                      - string
                      - 'null'
                  source:
                    type: string
                    description: Where it was created, e.g. ui or api
                  preheader:
                    type: string
                  query_string:
                    type: string
                  track_opens:
                    type: integer
                    enum:
                      - 0
                      - 1
                      - 2
                  track_clicks:
                    type: integer
                    enum:
                      - 0
                      - 1
                      - 2
                  list_ids:
                    type: array
                    items:
                      type: string
                    description: Encrypted list IDs
                  exclude_list_ids:
                    type: array
                    items:
                      type: string
                  segment_ids:
                    type: array
                    items:
                      type: integer
                  exclude_segment_ids:
                    type: array
                    items:
                      type: integer
                  web_version:
                    type: string
            text/plain:
              schema:
                type: string
                enum:
                  - No data passed
                  - API key not passed
                  - Invalid API key
                  - Campaign ID not passed
                  - Nothing to update
                  - Subject cannot be empty
                  - HTML cannot be empty
                  - Invalid from_email
                  - Invalid reply_to
                  - 'A field is too long: <field> (at most <n> characters)'
                  - track_opens and track_clicks must be 0, 1 or 2
                  - Brand does not exist
                  - Campaign does not exist
                  - Campaign has already been sent
                  - Unauthorised From email domain
                  - Domain "<domain>" is not verified in SES. Full domain verification is required to send emails.
                  - 'Account under review: <reason>. Sending is disabled.'
                  - Unable to update campaign
  /api/campaigns/duplicate-campaign.php:
    post:
      summary: Duplicate a campaign
      description: Copies a campaign into a new draft in the same brand
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - api_key
                - campaign_id
              properties:
                api_key:
                  type: string
                  description: Your API key. The brand is taken from the key.
                campaign_id:
                  type: integer
                  description: Campaign ID
                title:
                  type: string
                  description: The copy's dashboard label, max 500 characters; defaults to the original's
      responses:
        '200':
          description: JSON on success; errors are plain text. Every response is HTTP 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                    description: Dashboard label, or the subject if there is none
                  subject:
                    type: string
                  status:
                    type: string
                    enum:
                      - draft
                      - scheduled
                      - preparing
                      - sending
                      - sent
                      - paused
                  from_name:
                    type: string
                  from_email:
                    type: string
                  reply_to:
                    type: string
                  recipients:
                    type: integer
                    description: Emails sent so far
                  to_send:
                    type: integer
                    description: Emails the send is going to
                  sent_at:
                    type:
                      - integer
                      - 'null'
                    description: Unix timestamp sending started
                  scheduled_at:
                    type:
                      - integer
                      - 'null'
                    description: Unix timestamp, scheduled campaigns only
                  timezone:
                    type:
                      - string
                      - 'null'
                  source:
                    type: string
                    description: Where it was created, e.g. ui or api
                  preheader:
                    type: string
                  query_string:
                    type: string
                  track_opens:
                    type: integer
                    enum:
                      - 0
                      - 1
                      - 2
                  track_clicks:
                    type: integer
                    enum:
                      - 0
                      - 1
                      - 2
                  list_ids:
                    type: array
                    items:
                      type: string
                    description: Encrypted list IDs
                  exclude_list_ids:
                    type: array
                    items:
                      type: string
                  segment_ids:
                    type: array
                    items:
                      type: integer
                  exclude_segment_ids:
                    type: array
                    items:
                      type: integer
                  web_version:
                    type: string
            text/plain:
              schema:
                type: string
                enum:
                  - No data passed
                  - API key not passed
                  - Invalid API key
                  - Campaign ID not passed
                  - Title is too long
                  - Brand does not exist
                  - Campaign does not exist
                  - Unable to duplicate campaign
  /api/campaigns/delete-campaign.php:
    post:
      summary: Delete a campaign
      description: Deletes a campaign that is not preparing or sending, refunding a scheduled reservation
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - api_key
                - campaign_id
              properties:
                api_key:
                  type: string
                  description: Your API key. The brand is taken from the key.
                campaign_id:
                  type: integer
                  description: Campaign ID
      responses:
        '200':
          description: JSON on success; errors are plain text. Every response is HTTP 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id:
                    type: integer
                  deleted:
                    type: boolean
            text/plain:
              schema:
                type: string
                enum:
                  - No data passed
                  - API key not passed
                  - Invalid API key
                  - Campaign ID not passed
                  - Brand does not exist
                  - Campaign does not exist
                  - Campaign is sending
                  - Unable to delete campaign
  /api/campaigns/test-send.php:
    post:
      summary: Send a test email
      description: Sends a campaign as a test to up to 5 addresses (20 requests per brand per hour)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - api_key
                - campaign_id
                - emails
              properties:
                api_key:
                  type: string
                  description: Your API key. The brand is taken from the key.
                campaign_id:
                  type: integer
                  description: Campaign ID
                emails:
                  type: string
                  description: Comma-separated addresses, at most 5
      responses:
        '200':
          description: JSON on success; errors are plain text. Every response is HTTP 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign_id:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                        ok:
                          type: boolean
                        error:
                          type:
                            - string
                            - 'null'
            text/plain:
              schema:
                type: string
                enum:
                  - No data passed
                  - API key not passed
                  - Invalid API key
                  - Campaign ID not passed
                  - Email addresses not passed
                  - Too many email addresses
                  - Invalid email address.
                  - Brand does not exist
                  - Campaign does not exist
                  - Unauthorised From email domain
                  - Brand is under review due to high bounce rate. Sending is disabled.
                  - Quota exceeded. Please upgrade your plan.
                  - Domain not verified in SES. Please verify your domain before sending.
                  - Test send rate limit reached. Please wait about <n> minute(s) and try again.
  /api/campaigns/send.php:
    post:
      summary: Send a campaign
      description: Sends an existing draft to lists and/or segments in the brand
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - api_key
                - campaign_id
              properties:
                api_key:
                  type: string
                  description: Your API key. The brand is taken from the key.
                campaign_id:
                  type: integer
                  description: ID of the draft
                list_ids:
                  type: string
                  description: Comma-separated encrypted list IDs (required unless segment_ids)
                segment_ids:
                  type: string
                  description: Comma-separated segment IDs (required unless list_ids)
                exclude_list_ids:
                  type: string
                  description: Comma-separated encrypted list IDs to exclude
                exclude_segment_ids:
                  type: string
                  description: Comma-separated segment IDs to exclude
                dry_run:
                  type: string
                  description: 1, yes or true to run every check and count recipients without acting
      responses:
        '200':
          description: JSON on success; errors are plain text. Every response is HTTP 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - sending
                      - dry_run
                  campaign_id:
                    type: integer
                  recipients:
                    type: integer
            text/plain:
              schema:
                type: string
                enum:
                  - No data passed
                  - API key not passed
                  - Invalid API key
                  - Campaign ID not passed
                  - List or segment ID(s) not passed
                  - Brand does not exist
                  - Campaign does not exist
                  - Campaign is scheduled
                  - Campaign has already been sent
                  - One or more list IDs are invalid
                  - One or more segment IDs are invalid
                  - Unauthorised From email domain
                  - Domain "<domain>" is not verified in SES. Full domain verification is required to send emails.
                  - 'Account under review: <reason>. Sending is disabled.'
                  - Unable to count recipients
                  - No active subscribers to send to
                  - 'Error: This campaign would exceed your monthly sending allowance. Reduce the recipients, or renew your plan to send more.'
                  - 'Error: This campaign would exceed your sending quota. Reduce the recipients or increase your quota, then try again.'
                  - Unable to send campaign
  /api/campaigns/schedule.php:
    post:
      summary: Schedule a campaign
      description: Schedules a draft or reschedules a scheduled campaign, reserving quota
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - api_key
                - campaign_id
                - schedule_date_time
              properties:
                api_key:
                  type: string
                  description: Your API key. The brand is taken from the key.
                campaign_id:
                  type: integer
                  description: ID of the draft or scheduled campaign
                schedule_date_time:
                  type: string
                  description: When to send, any format strtotime() reads; must be in the future
                schedule_timezone:
                  type: string
                  description: PHP timezone identifier; defaults to the account's timezone
                list_ids:
                  type: string
                  description: Comma-separated encrypted list IDs (required unless segment_ids)
                segment_ids:
                  type: string
                  description: Comma-separated segment IDs (required unless list_ids)
                exclude_list_ids:
                  type: string
                  description: Comma-separated encrypted list IDs to exclude
                exclude_segment_ids:
                  type: string
                  description: Comma-separated segment IDs to exclude
                dry_run:
                  type: string
                  description: 1, yes or true to run every check and count recipients without acting
      responses:
        '200':
          description: JSON on success; errors are plain text. Every response is HTTP 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - scheduled
                      - dry_run
                  campaign_id:
                    type: integer
                  recipients:
                    type: integer
                  scheduled_at:
                    type: integer
                    description: Unix timestamp
                  timezone:
                    type: string
            text/plain:
              schema:
                type: string
                enum:
                  - No data passed
                  - API key not passed
                  - Invalid API key
                  - Campaign ID not passed
                  - List or segment ID(s) not passed
                  - schedule_date_time not passed
                  - Brand does not exist
                  - schedule_timezone is invalid
                  - schedule_date_time is invalid
                  - schedule_date_time is in the past
                  - Campaign does not exist
                  - Campaign has already been sent
                  - One or more list IDs are invalid
                  - One or more segment IDs are invalid
                  - Unauthorised From email domain
                  - Domain "<domain>" is not verified in SES. Full domain verification is required to send emails.
                  - 'Account under review: <reason>. Sending is disabled.'
                  - Unable to count recipients
                  - No active subscribers to send to
                  - 'Error: This campaign would exceed your monthly sending allowance. Reduce the recipients, or renew your plan to send more.'
                  - 'Error: This campaign would exceed your sending quota. Reduce the recipients or increase your quota, then try again.'
                  - Unable to schedule campaign
                  - Campaign was changed by another request. Try again.
  /api/campaigns/unschedule.php:
    post:
      summary: Unschedule a campaign
      description: Turns a scheduled campaign back into a draft and refunds its quota reservation
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - api_key
                - campaign_id
              properties:
                api_key:
                  type: string
                  description: Your API key. The brand is taken from the key.
                campaign_id:
                  type: integer
                  description: Campaign ID
      responses:
        '200':
          description: JSON on success; errors are plain text. Every response is HTTP 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - draft
                  campaign_id:
                    type: integer
            text/plain:
              schema:
                type: string
                enum:
                  - No data passed
                  - API key not passed
                  - Invalid API key
                  - Campaign ID not passed
                  - Brand does not exist
                  - Campaign does not exist
                  - Campaign is not scheduled
                  - Unable to unschedule campaign
  /api/campaigns/stats.php:
    post:
      summary: Campaign stats
      description: Opens, clicks, bounces, complaints and unsubscribes for a campaign in the API key's brand
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - api_key
                - campaign_id
              properties:
                api_key:
                  type: string
                  description: Your API key. The brand is taken from the key.
                campaign_id:
                  type: integer
                  description: Campaign ID
      responses:
        '200':
          description: JSON on success; errors are plain text. Every response is HTTP 200.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  status:
                    type: string
                  recipients:
                    type: integer
                  opens:
                    type: object
                    properties:
                      total:
                        type: integer
                      unique:
                        type: integer
                      rate:
                        type: number
                        description: Percentage, 2 decimals
                  clicks:
                    type: object
                    properties:
                      total:
                        type: integer
                      unique:
                        type: integer
                      rate:
                        type: number
                        description: Percentage, 2 decimals
                  bounces:
                    type: object
                    properties:
                      hard:
                        type: integer
                      soft:
                        type: integer
                  complaints:
                    type: integer
                  unsubscribes:
                    type: integer
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        clicks:
                          type: integer
                        unique_clicks:
                          type: integer
            text/plain:
              schema:
                type: string
                enum:
                  - No data passed
                  - API key not passed
                  - Invalid API key
                  - Campaign ID not passed
                  - Brand does not exist
                  - Campaign does not exist
  /api/campaigns/get-activity.php:
