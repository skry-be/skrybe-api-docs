                  type: string
                list:
                  type: string
                  description: Encrypted list ID
                boolean:
                  type: string
                  description: true for a plain-text response
                  enum:
                    - 'true'
              required:
                - email
                - list
                - boolean
      responses:
        '200':
          description: 1 on success, or an error message
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - '1'
                  - Some fields are missing.
                  - Invalid email address.
                  - Email does not exist.
