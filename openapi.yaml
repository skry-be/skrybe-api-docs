                  type: string
                  description: Encrypted list ID
                status:
                  type: string
                  description: Only subscribers in this state
                  enum:
                    - active
                    - unconfirmed
                    - unsubscribed
                    - bounced
                    - complained
                page:
                  type: integer
                  description: 1-based page number
                  default: 1
                  minimum: 1
                limit:
                  type: integer
                  description: Page size
                  default: 100
                  minimum: 1
                  maximum: 1000
              required:
                - api_key
                - list_id
      responses:
        '200':
          description: Success, or a plain-text error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  list_id:
                    type: string
                  status:
                    type:
                      - string
                      - 'null'
                    enum:
                      - active
                      - unconfirmed
                      - unsubscribed
                      - bounced
                      - complained
                      - null
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer
                    description: Subscribers matching the filter, across all pages
                  subscribers:
                    type: array
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                        name:
                          type: string
                        status:
                          type: string
                          enum:
                            - active
                            - unconfirmed
                            - unsubscribed
                            - bounced
                            - complained
                        joined_at:
                          type:
                            - integer
                            - 'null'
                          description: Unix timestamp
                        custom_fields:
                          type: object
                          description: Keyed by field name; null when empty; Date fields as YYYY-MM-DD
                          additionalProperties:
                            type:
                              - string
                              - 'null'
            text/plain:
              schema:
                type: string
                description: Error message
                enum:
                  - No data passed
                  - API key not passed
                  - Invalid API key
                  - List ID not passed
                  - Invalid status
                  - Invalid page
                  - Invalid limit
                  - List does not exist
                  - Unable to read subscribers
  /subscribe:
    post:
      tags:
        - Subscribers
      summary: Subscribe
      description: Adds or updates a subscriber. Pass boolean=true for a plain-text response (otherwise an HTML page). Custom fields are passed by field name with spaces removed. Errors are returned as plain text with HTTP 200.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                api_key:
                  type: string
                  description: A brand API key of the list's brand
                email:
                  type: string
                list:
                  type: string
                  description: Encrypted list ID
                name:
                  type: string
                country:
                  type: string
                  description: 2-letter country code in capitals
                ipaddress:
                  type: string
                referrer:
                  type: string
                  description: URL
                notes:
                  type: string
                gdpr:
                  type: string
                  enum:
                    - 'true'
                    - 'false'
                silent:
                  type: string
                  description: true skips double opt-in
                  enum:
                    - 'true'
                hp:
                  type: string
                  description: Honeypot; any value rejects the call
                boolean:
                  type: string
                  description: true for a plain-text response
                  enum:
                    - 'true'
              required:
                - api_key
                - email
                - list
                - boolean
      responses:
        '200':
          description: 1 on success, or an error message
          content:
            text/plain:
              schema:
                type: string
                examples:
                  - '1'
                  - Some fields are missing.
                  - Invalid email address.
                  - IP address is invalid.
                  - Country must be a valid 2 letter country code
                  - Referrer is not a valid URL
                  - Bounced email address.
                  - Invalid list ID.
                  - API key not passed
                  - Invalid API key
                  - Already subscribed.
                  - Email is suppressed.
  /unsubscribe:
    post:
      tags:
        - Subscribers
      summary: Unsubscribe
      description: Unsubscribes an address from a list (or from all of the brand's lists, if the list is set to). Takes no API key. Pass boolean=true for a plain-text response. Errors are returned as plain text with HTTP 200.
      requestBody:
        required: true
