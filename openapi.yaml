                  default: 1
                send_campaign:
                  type: integer
                  enum:
                    - 0
                    - 1
                  default: 0
                schedule_date_time:
                  type: string
                  description: eg. June 15, 2021 6:05pm
                schedule_timezone:
                  type: string
                  description: eg. America/New_York; defaults to the main account timezone
                json:
                  type: integer
                  description: 1 for a JSON response with campaign_id (drafts only)
              required:
                - api_key
                - from_name
                - from_email
                - reply_to
                - subject
                - html_text
      responses:
        '200':
          description: Success, or a plain-text error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - Campaign created
                  campaign_id:
                    type: string
            text/plain:
              schema:
                type: string
                description: Campaign created, Campaign created and now sending, or Campaign scheduled. Errors are one of the listed plain-text messages.
                examples:
                  - No data passed
                  - API key not passed
                  - Invalid API key
                  - From name not passed
                  - From email not passed
                  - Reply to email not passed
                  - Subject not passed
                  - HTML not passed
                  - List or segment ID(s) not passed
                  - Brand ID not passed.
                  - One or more list IDs are invalid
                  - One or more segment IDs are invalid
                  - List or segment IDs does not belong to a single brand
                  - Unauthorised From email domain
                  - schedule_date_time is invalid
                  - Unable to calculate totals
                  - Unable to create campaign
                  - Unable to create and send campaign
                  - Unable to schedule campaign
  /api/admin/brands/set-transport.php:
    post:
      tags:
        - Admin
      summary: Set transport
      description: Shows or switches whether a brand sends through the SMTP relay or SES. Main account key only; the brand must belong to the main account. relay verifies the login (STARTTLS on 587, AUTH, MAIL/RCPT with the brand's From address, no DATA) before saving unless verify=0; ses clears smtp_host only. Refused while a campaign of the brand is sending unless force=1. Errors are returned as plain text with HTTP 200.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                api_key:
                  type: string
                  description: The main account's API key (brand keys are rejected)
                brand_id:
                  type: integer
                  description: Brand ID
                transport:
                  type: string
                  description: Omit to only read the current setting
                  enum:
                    - relay
                    - ses
                smtp_password:
                  type: string
                  description: Relay only; may be omitted if one is stored for the same username
                smtp_username:
                  type: string
                  description: Relay only; defaults to the brand's relay login (brand<ID> in production)
                smtp_host:
                  type: string
                  description: Relay only; defaults to the Skrybe relay (mta1.skry.be)
                verify:
                  type: string
                  description: Relay only; 0 skips the login check
                  enum:
                    - '0'
                    - '1'
                  default: '1'
                force:
                  type: string
                  description: 1 switches even while a campaign is sending
                  enum:
                    - '0'
                    - '1'
                  default: '0'
              required:
                - api_key
                - brand_id
      responses:
        '200':
          description: Success, or a plain-text error message
          content:
            application/json:
              schema:
                type: object
                properties:
                  brand_id:
                    type: integer
                  name:
                    type: string
                  transport:
                    type: string
                    enum:
                      - relay
                      - ses
                      - smtp
                  smtp_host:
                    type: string
                  smtp_port:
                    type: string
                  smtp_ssl:
                    type: string
                  smtp_username:
                    type: string
                  smtp_password_set:
                    type: boolean
            text/plain:
              schema:
                type: string
                description: Error message
                enum:
                  - No data passed
                  - API key not passed
                  - Invalid API key
                  - Brand ID not passed
                  - No brand with that ID in this account
                  - transport must be relay or ses
                  - RELAY_ENVIRONMENT is not set on this server, so the relay login can't be chosen. Set it to production, staging, ...
                  - 'smtp_username does not match this environment: the relay login for this brand here is <login>'
                  - Invalid smtp_username
                  - Invalid smtp_host
                  - smtp_password not passed, and the brand has none stored for this username
                  - A campaign of this brand is sending. Wait for it to finish, or pass force=1
                  - Unable to update brand
                  - 'Could not connect to <host>:587: <reason>'
                  - 'TLS failed with <host>: <reason>'
                  - 'The relay refused the login <username>: <reason>'
                  - 'The relay refused <from_email> for <username>: <reason>'
  /api/admin/subscribers/active-subscriber-count.php:
    post:
      tags:
