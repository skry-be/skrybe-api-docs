  /api/emails/send.php:
    post:
      summary: Send individual emails
      description: Sends or schedules an email to up to 250 addresses by creating a campaign in the brand
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - api_key
                - from_name
                - from_email
                - reply_to
                - subject
                - html_text
                - to
              properties:
                api_key:
                  type: string
                  description: Your API key. The brand is taken from the key.
                from_name:
                  type: string
                  description: From name
                from_email:
                  type: string
                  description: From email on one of the brand's allowed domains
                reply_to:
                  type: string
                  description: Reply to email
                subject:
                  type: string
                  description: Subject, also the campaign title
                plain_text:
                  type: string
                  description: Plain text version
                html_text:
                  type: string
                  description: HTML version
                to:
                  type: string
                  description: JSON-encoded array of email addresses, at most 250
                recipient-variables:
                  type: string
                  description: JSON-encoded object keyed by email; values become custom fields on the new list
                list_ids:
                  type: string
                  description: Comma-separated list IDs in the brand to send to instead of creating a new list. Encrypted IDs from get-lists, or numeric IDs
                segment_ids:
                  type: string
                  description: Comma-separated numeric segment IDs in the brand to also send to
                exclude_list_ids:
                  type: string
                  description: Lists whose subscribers are left out, same format as list_ids
                exclude_segments_ids:
                  type: string
                  description: Segments whose subscribers are left out, same format as segment_ids
                query_string:
                  type: string
                  description: Google Analytics tags
                track_opens:
                  type: integer
                  description: 0=disable, 1=enable, 2=anonymous
                  enum:
                    - 0
                    - 1
                    - 2
                  default: 1
                track_clicks:
                  type: integer
                  description: 0=disable, 1=enable, 2=anonymous
                  enum:
                    - 0
                    - 1
                    - 2
                  default: 1
                schedule_date_time:
                  type: string
                  description: Schedule date/time (e.g. "June 15, 2027 6:05pm")
                schedule_timezone:
                  type: string
                  description: PHP timezone identifier (e.g. "America/New_York")
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                  message:
                    type: string
                    enum:
                      - Campaign created and now sending
                      - Campaign scheduled
                  data:
                    type: object
                    properties:
                      campaign_id:
                        type: integer
                  timestamp:
                    type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: string
                    enum:
                      - No data passed
                      - API key not passed
                      - Invalid API key
                      - From name not passed
                      - From email not passed
                      - Reply to email not passed
                      - Subject not passed
                      - HTML not passed
                      - No recipient emails provided
                      - Maximum 250 recipients per API request.
                      - Invalid email address format
                      - schedule_timezone is invalid
                      - schedule_date_time is invalid
                      - Unauthorised From email domain
                      - Domain "<domain>" is not verified in SES. Full domain verification is required.
                      - One or more list IDs are invalid
                      - One or more segment IDs are invalid
                  timestamp:
                    type: string
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: string
                    enum:
                      - Subscription expired or monthly quota exceeded
                  timestamp:
                    type: string
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: string
                    enum:
                      - 'Account under review: <reason>. Sending is disabled.'
                  timestamp:
                    type: string
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: string
                    enum:
                      - Too many failed attempts. Try again later.
                  timestamp:
                    type: string
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - false
                  error:
                    type: string
                    enum:
                      - 'Unable to create campaign: <database error>'
                  timestamp:
                    type: string
  /api/emails/send-transactional.php:
    post:
      summary: Send transactional email
      description: Sends one email to one recipient immediately. JSON body only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - api_key
                - to_email
                - subject
              properties:
                api_key:
                  type: string
                  description: Your API key. The brand is taken from the key.
                to_email:
                  type: string
                  description: Single recipient address
                subject:
                  type: string
                  description: Subject
                from_email:
                  type: string
                  description: From email on one of the brand's allowed domains. Defaults to the brand's From email
                html_body:
                  type: string
                  description: HTML version; required unless plain_body
                plain_body:
                  type: string
                  description: Plain text version; required unless html_body
                from_name:
                  type: string
                  description: Defaults to the brand's From name
                reply_to:
                  type: string
                  description: Defaults to the brand's Reply to when from_name or from_email is omitted, otherwise to from_email
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - success
                  message:
                    type: string
                    enum:
                      - Email sent successfully.
                  message_id:
                    type: string
                    description: SES message ID, when sent through SES
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - error
                  message:
                    type: string
                    enum:
                      - Invalid JSON payload.
                      - 'Missing required fields. Required: api_key, to_email, subject, and html_body or plain_body.'
                      - Invalid to_email format.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - error
                  message:
                    type: string
                    enum:
                      - Invalid API key.
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - error
                  message:
                    type: string
                    enum:
                      - Quota exceeded or subscription expired.
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - error
                  message:
                    type: string
                    enum:
                      - This From email domain is not authorized for the specified brand.
                      - Domain "<domain>" is not verified in SES. Full domain verification is required.
                      - 'Account under review: <reason>. Sending is disabled.'
        '405':
          description: Method Not Allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - error
                  message:
                    type: string
                    enum:
                      - Only POST method is accepted.
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - error
                  message:
                    type: string
                    enum:
                      - Too many failed attempts. Try again later.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - error
                  message:
                    type: string
                    enum:
                      - Database error while fetching credentials.
                      - No sending credentials for this brand.
                      - No sending method configured for this brand.
                      - SES rejected the message.
                      - Email could not be sent.
                      - An exception occurred.
                  error_info:
                    type: string
                  code:
                    type: integer
                    description: SES rejections only
